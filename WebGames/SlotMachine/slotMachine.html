<!DOCTYPE html>
<html>

<head>
    <title>Slotmachine</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="slotMachine.css">
    <link rel="icon" href="../../SiteImages/boxIcon.png">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <a href="../../index.html">
            <img src="../../SiteImages/limbo438Box.png" class="logo">
        </a>
    </header>

    <h1>Slotmachine</h1>

    <div id="slotMachine">

        <div class="reelWindow">
            <div class="reel" id="reel1"></div>
        </div>

        <div class="reelWindow">
            <div class="reel" id="reel2"></div>
        </div>

        <div class="reelWindow">
            <div class="reel" id="reel3"></div>
        </div>

    </div>

    <p>Balance: <span id="balance">100</span></p>

    <div id="betControls">
        <button id="minusBetButton">-</button>
        <span>Bet: <span id="bet">10</span></span>
        <button id="plusBetButton">+</button>
    </div>

    <button id="spinButton">SPIN</button>
    <button id="restartButton" style="display: none;">RESTART</button>

    <p id="message"></p>

    <script src="slotMachine.js"></script>

</body>

</html>
